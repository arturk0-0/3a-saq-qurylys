# Copy to deploy/cloud-run.env.yaml (ignored), then select an available Gemini model.
# No private key path: Cloud Run uses its attached service account through ADC.
FIREBASE_ENABLED: "true"
FIREBASE_DEMO_ONLY: "true"
FIREBASE_PROJECT_ID: saq-qurylys
FIREBASE_STORAGE_BUCKET: saq-qurylys.firebasestorage.app
CORS_ORIGINS: '["https://saq-qurylys.web.app","https://saq-qurylys.firebaseapp.com"]'
GEMINI_MODEL: ""
AI_DAILY_USER_LIMIT: "5"
AI_DAILY_GLOBAL_LIMIT: "20"
SEARCHAPI_ENABLED: "false"
SEARCHAPI_SCHEDULE_ENABLED: "false"
SEARCHAPI_DAILY_LIMIT: "2"
SEARCHAPI_CREDIT_RESERVE: "20"
# SEARCHAPI_API_KEY also belongs in Secret Manager, never this YAML.
# GEMINI_API_KEY is injected from Secret Manager, not this YAML or VITE variables.
