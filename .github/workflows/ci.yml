name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.12.23
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run --frozen ruff check . && uv run --frozen ruff format --check . && uv run --frozen pytest
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --wait-timeout 120
      - run: |
          curl --fail http://127.0.0.1:8000/api/v1/health
          curl --fail http://127.0.0.1:5173/api/v1/health
      - if: always()
        run: docker compose logs && docker compose down
